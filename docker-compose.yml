services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillbridge
      POSTGRES_PASSWORD: skillbridge
      POSTGRES_DB: skillbridge
    ports:
      - "5432:5432"
    volumes:
      - skillbridge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillbridge -d skillbridge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  skillbridge-postgres:
